<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dot Font Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #ffffff;
      color: #111111;
      min-height: 100vh;
      padding: 48px 40px 60px;
    }

    .app {
      max-width: 900px;
      margin: 0 auto;
    }

    .app-header {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 48px;
    }

    .app-title {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #999;
      white-space: nowrap;
    }

    .app-divider {
      flex: 1;
      height: 0.5px;
      background: #e0e0e0;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 0.5px solid #e0e0e0;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .control-cell {
      padding: 20px 24px;
      border-right: 0.5px solid #e0e0e0;
      border-bottom: 0.5px solid #e0e0e0;
    }

    .control-cell:nth-child(2n) { border-right: none; }
    .control-cell:nth-last-child(-n+2) { border-bottom: none; }

    .textarea-cell {
      grid-column: 1 / -1;
      border-right: none;
      border-bottom: 0.5px solid #e0e0e0;
    }

    .control-label {
      font-size: 11px;
      font-family: 'DM Mono', monospace;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #999;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .control-value {
      font-weight: 500;
      color: #111;
      letter-spacing: 0;
      text-transform: none;
      font-family: 'DM Sans', sans-serif;
    }

    textarea {
      width: 100%;
      border: none;
      background: transparent;
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      font-weight: 300;
      color: #111;
      resize: none;
      outline: none;
      line-height: 1.6;
      height: 56px;
    }

    textarea::placeholder { color: #bbb; }

    input[type="range"] {
      width: 100%;
      accent-color: #111;
      cursor: pointer;
    }

    .canvas-area {
      border: 0.5px solid #e0e0e0;
      border-radius: 12px;
      padding: 40px;
      overflow: auto;
      min-height: 200px;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      background: #ffffff;
    }

    .canvas-inner {
      position: relative;
      flex-shrink: 0;
    }

    .dot-el {
      position: absolute;
      border-radius: 50%;
      background: #111111;
      transform: translate(-50%, -50%);
    }

    .bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 16px;
    }

    .dot-count {
      font-size: 11px;
      font-family: 'DM Mono', monospace;
      color: #999;
      letter-spacing: 0.08em;
    }

    .export-btn {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 8px 18px;
      border: 0.5px solid #ccc;
      border-radius: 8px;
      background: transparent;
      color: #555;
      cursor: pointer;
      transition: background 0.12s, color 0.12s;
    }

    .export-btn:hover { background: #f5f5f5; color: #111; }
    .export-btn:active { transform: scale(0.98); }
  </style>
</head>
<body>
<div class="app">

  <div class="app-header">
    <span class="app-title">Dot Font</span>
    <div class="app-divider"></div>
  </div>

  <div class="controls">
    <div class="control-cell textarea-cell">
      <div class="control-label">Text</div>
      <textarea id="txt" placeholder="Type something..." spellcheck="false">HELLO
WORLD</textarea>
    </div>

    <div class="control-cell">
      <div class="control-label">
        Weight
        <span class="control-value" id="wLabel">0.50</span>
      </div>
      <input type="range" id="weight" min="0" max="2" step="0.01" value="0.5">
    </div>

    <div class="control-cell">
      <div class="control-label">
        Letter Spacing
        <span class="control-value" id="sLabel">20px</span>
      </div>
      <input type="range" id="spacing" min="0" max="100" step="1" value="20">
    </div>

    <div class="control-cell">
      <div class="control-label">
        Cell Size
        <span class="control-value" id="cLabel">40px</span>
      </div>
      <input type="range" id="cellsize" min="20" max="80" step="1" value="40">
    </div>

    <div class="control-cell">
      <div class="control-label">
        Line Gap
        <span class="control-value" id="gLabel">40px</span>
      </div>
      <input type="range" id="linegap" min="10" max="120" step="2" value="40">
    </div>
  </div>

  <div class="canvas-area">
    <div class="canvas-inner" id="canvas"></div>
  </div>

  <div class="bottom-bar">
    <span class="dot-count" id="dotCount">— dots</span>
    <button class="export-btn" id="exportBtn">Export SVG ↗</button>
  </div>

</div>

<script>
(function () {
  var glyphs = {
    A: ["01110","10001","10001","11111","10001","10001","10001"],
    B: ["11110","10001","10001","11110","10001","10001","11110"],
    C: ["01110","10001","10000","10000","10000","10001","01110"],
    D: ["11100","10010","10001","10001","10001","10010","11100"],
    E: ["11111","10000","10000","11110","10000","10000","11111"],
    F: ["11111","10000","10000","11110","10000","10000","10000"],
    G: ["01110","10001","10000","10111","10001","10001","01110"],
    H: ["10001","10001","10001","11111","10001","10001","10001"],
    I: ["01110","00100","00100","00100","00100","00100","01110"],
    J: ["00111","00010","00010","00010","10010","10010","01100"],
    K: ["10001","10010","10100","11000","10100","10010","10001"],
    L: ["10000","10000","10000","10000","10000","10000","11111"],
    M: ["10001","11011","10101","10001","10001","10001","10001"],
    N: ["10001","11001","10101","10011","10001","10001","10001"],
    O: ["01110","10001","10001","10001","10001","10001","01110"],
    P: ["11110","10001","10001","11110","10000","10000","10000"],
    Q: ["01110","10001","10001","10001","10101","10010","01101"],
    R: ["11110","10001","10001","11110","10100","10010","10001"],
    S: ["01111","10000","10000","01110","00001","00001","11110"],
    T: ["11111","00100","00100","00100","00100","00100","00100"],
    U: ["10001","10001","10001","10001","10001","10001","01110"],
    V: ["10001","10001","10001","10001","10001","01010","00100"],
    W: ["10001","10001","10001","10001","10101","11011","10001"],
    X: ["10001","01010","00100","00100","00100","01010","10001"],
    Y: ["10001","01010","00100","00100","00100","00100","00100"],
    Z: ["11111","00001","00010","00100","01000","10000","11111"],
    " ": null
  };

  var cols = 5, rows = 7;

  function computeDots() {
    var txt     = document.getElementById('txt').value.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    var weight  = parseFloat(document.getElementById('weight').value);
    var spacing = parseInt(document.getElementById('spacing').value);
    var cell    = parseInt(document.getElementById('cellsize').value);
    var lgap    = parseInt(document.getElementById('linegap').value);
    var lineGap = rows * cell + lgap;

    var minR      = cell * 0.1;
    var midR      = cell * 0.45;
    var blobExtra = cell;

    var base = Math.min(weight, 1);
    var diam = (minR + (midR - minR) * base) * 2;
    if (weight > 1) diam += blobExtra * (weight - 1);
    var r = diam / 2;

    var lines = txt.split('\n');
    var dots  = [];
    var maxW  = 0;

    lines.forEach(function (line, li) {
      var ox = 0;
      var oy = li * lineGap;

      for (var ci = 0; ci < line.length; ci++) {
        var ch = line[ci].toUpperCase();
        var g  = glyphs[ch];

        if (!g) { ox += cols * cell + spacing; continue; }

        for (var y = 0; y < rows; y++) {
          for (var x = 0; x < cols; x++) {
            if (g[y][x] === '1') {
              dots.push({ cx: ox + x * cell + cell / 2, cy: oy + y * cell + cell / 2, r: r });
            }
          }
        }
        ox += cols * cell + spacing;
      }
      if (ox > maxW) maxW = ox;
    });

    if (maxW === 0) maxW = cols * cell;
    return { dots: dots, w: maxW, h: lineGap * lines.length };
  }

  function draw() {
    document.getElementById('wLabel').textContent = parseFloat(document.getElementById('weight').value).toFixed(2);
    document.getElementById('sLabel').textContent = document.getElementById('spacing').value + 'px';
    document.getElementById('cLabel').textContent = document.getElementById('cellsize').value + 'px';
    document.getElementById('gLabel').textContent = document.getElementById('linegap').value + 'px';

    var res    = computeDots();
    var canvas = document.getElementById('canvas');
    canvas.innerHTML = '';
    canvas.style.width  = res.w + 'px';
    canvas.style.height = res.h + 'px';

    res.dots.forEach(function (dot) {
      var el   = document.createElement('div');
      el.className = 'dot-el';
      var diam = dot.r * 2;
      el.style.left   = dot.cx + 'px';
      el.style.top    = dot.cy + 'px';
      el.style.width  = diam + 'px';
      el.style.height = diam + 'px';
      canvas.appendChild(el);
    });

    document.getElementById('dotCount').textContent = res.dots.length + ' dots';
  }

  function exportSvg() {
    var res   = computeDots();
    var lines = [
      '<svg xmlns="http://www.w3.org/2000/svg" width="' + res.w + '" height="' + res.h + '" viewBox="0 0 ' + res.w + ' ' + res.h + '">'
    ];
    res.dots.forEach(function (d) {
      lines.push('  <circle cx="' + d.cx.toFixed(1) + '" cy="' + d.cy.toFixed(1) + '" r="' + d.r.toFixed(1) + '" fill="black"/>');
    });
    lines.push('</svg>');

    var svg  = lines.join('\n');
    var blob = new Blob([svg], { type: 'image/svg+xml' });
    var url  = URL.createObjectURL(blob);
    var a    = document.createElement('a');
    a.href = url;
    a.download = 'dot-font.svg';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  ['txt', 'weight', 'spacing', 'cellsize', 'linegap'].forEach(function (id) {
    document.getElementById(id).addEventListener('input', draw);
  });
  document.getElementById('exportBtn').addEventListener('click', exportSvg);

  draw();
})();
</script>
</body>
</html>
