<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dot Font Generator</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #ffffff;
      color: #111111;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── TOP BAR ── */
    .topbar {
      display: flex;
      align-items: stretch;
      border-bottom: 1px solid #111;
      background: #ffffff;
      flex-shrink: 0;
    }

    .topbar-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 13px 26px;
      border-right: 1px solid #111;
      display: flex;
      align-items: center;
      color: #111;
    }

    .topbar-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      padding: 0 22px;
      gap: 20px;
    }

    .dot-count {
      font-size: 10px;
      letter-spacing: 0.12em;
      color: #999;
      text-transform: uppercase;
    }

    .export-btn {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 8px 18px;
      border: 1px solid #111;
      background: transparent;
      color: #111;
      cursor: pointer;
      transition: background 0.1s, color 0.1s;
    }

    .export-btn:hover { background: #111; color: #fff; }
    .export-btn:active { opacity: 0.7; }

    /* ── LAYOUT ── */
    .layout {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 280px;
      flex-shrink: 0;
      border-right: 1px solid #111;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .panel-section {
      border-bottom: 1px solid #e0e0e0;
      padding: 18px 20px 20px;
    }

    .section-title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #999;
      margin-bottom: 14px;
    }

    textarea {
      width: 100%;
      background: #f5f5f5;
      border: 1px solid #e0e0e0;
      outline: none;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 12px;
      color: #111;
      padding: 10px 12px;
      resize: none;
      height: 68px;
      line-height: 1.6;
    }

    textarea::placeholder { color: #bbb; }

    .ctrl-row { margin-bottom: 16px; }
    .ctrl-row:last-child { margin-bottom: 0; }

    .ctrl-label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
    }

    .ctrl-name {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #999;
    }

    .ctrl-val {
      font-size: 11px;
      font-weight: 700;
      color: #111;
    }

    /* ── SLIDER — round thumb ── */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 1px;
      background: #ccc;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      background: #111;
      border-radius: 50%;
      cursor: pointer;
      border: none;
    }

    input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      background: #111;
      border-radius: 50%;
      border: none;
      cursor: pointer;
    }

    /* ── CANVAS ── */
    .canvas-wrap {
      flex: 1;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      padding: 48px;
      overflow: auto;
      background: #ffffff;
    }

    .canvas-inner {
      position: relative;
      flex-shrink: 0;
    }

    .dot-el {
      position: absolute;
      border-radius: 50%;
      background: #111111;
      transform: translate(-50%, -50%);
    }
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-title">Particle Controls</div>
  <div class="topbar-right">
    <span class="dot-count" id="dotCount">— dots</span>
    <button class="export-btn" id="exportBtn">Save SVG</button>
  </div>
</div>

<div class="layout">

  <div class="sidebar">

    <div class="panel-section">
      <textarea id="txt" placeholder="Type here..." spellcheck="false"></textarea>
    </div>

    <div class="panel-section">
      <div class="section-title">Dot Weight</div>
      <div class="ctrl-row">
        <div class="ctrl-label">
          <span class="ctrl-name">Weight</span>
          <span class="ctrl-val" id="wLabel">0.50</span>
        </div>
        <input type="range" id="weight" min="0" max="2" step="0.01" value="0.5">
      </div>
    </div>

    <div class="panel-section">
      <div class="section-title">Spacing</div>
      <div class="ctrl-row">
        <div class="ctrl-label">
          <span class="ctrl-name">Letter Spacing</span>
          <span class="ctrl-val" id="sLabel">20px</span>
        </div>
        <input type="range" id="spacing" min="0" max="100" step="1" value="20">
      </div>
      <div class="ctrl-row">
        <div class="ctrl-label">
          <span class="ctrl-name">Line Gap</span>
          <span class="ctrl-val" id="gLabel">40px</span>
        </div>
        <input type="range" id="linegap" min="10" max="120" step="2" value="40">
      </div>
    </div>

    <div class="panel-section">
      <div class="section-title">Size</div>
      <div class="ctrl-row">
        <div class="ctrl-label">
          <span class="ctrl-name">Cell Size</span>
          <span class="ctrl-val" id="cLabel">40px</span>
        </div>
        <input type="range" id="cellsize" min="20" max="80" step="1" value="40">
      </div>
    </div>

  </div>

  <div class="canvas-wrap">
    <div class="canvas-inner" id="canvas"></div>
  </div>

</div>

<script>
(function () {
  var glyphs = {
    A: ["01110","10001","10001","11111","10001","10001","10001"],
    B: ["11110","10001","10001","11110","10001","10001","11110"],
    C: ["01110","10001","10000","10000","10000","10001","01110"],
    D: ["11100","10010","10001","10001","10001","10010","11100"],
    E: ["11111","10000","10000","11110","10000","10000","11111"],
    F: ["11111","10000","10000","11110","10000","10000","10000"],
    G: ["01110","10001","10000","10111","10001","10001","01110"],
    H: ["10001","10001","10001","11111","10001","10001","10001"],
    I: ["01110","00100","00100","00100","00100","00100","01110"],
    J: ["00111","00010","00010","00010","10010","10010","01100"],
    K: ["10001","10010","10100","11000","10100","10010","10001"],
    L: ["10000","10000","10000","10000","10000","10000","11111"],
    M: ["10001","11011","10101","10001","10001","10001","10001"],
    N: ["10001","11001","10101","10011","10001","10001","10001"],
    O: ["01110","10001","10001","10001","10001","10001","01110"],
    P: ["11110","10001","10001","11110","10000","10000","10000"],
    Q: ["01110","10001","10001","10001","10101","10010","01101"],
    R: ["11110","10001","10001","11110","10100","10010","10001"],
    S: ["01111","10000","10000","01110","00001","00001","11110"],
    T: ["11111","00100","00100","00100","00100","00100","00100"],
    U: ["10001","10001","10001","10001","10001","10001","01110"],
    V: ["10001","10001","10001","10001","10001","01010","00100"],
    W: ["10001","10001","10001","10001","10101","11011","10001"],
    X: ["10001","01010","00100","00100","00100","01010","10001"],
    Y: ["10001","01010","00100","00100","00100","00100","00100"],
    Z: ["11111","00001","00010","00100","01000","10000","11111"],
    " ": null
  };

  var cols = 5, rows = 7;

  function computeDots() {
    var txt     = document.getElementById('txt').value.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
    var weight  = parseFloat(document.getElementById('weight').value);
    var spacing = parseInt(document.getElementById('spacing').value);
    var cell    = parseInt(document.getElementById('cellsize').value);
    var lgap    = parseInt(document.getElementById('linegap').value);
    var lineGap = rows * cell + lgap;

    var minR      = cell * 0.1;
    var midR      = cell * 0.45;
    var blobExtra = cell;

    var base = Math.min(weight, 1);
    var diam = (minR + (midR - minR) * base) * 2;
    if (weight > 1) diam += blobExtra * (weight - 1);
    var r = diam / 2;

    var lines = txt.split('\n');
    var dots  = [];
    var maxW  = 0;

    lines.forEach(function (line, li) {
      var ox = 0;
      var oy = li * lineGap;
      for (var ci = 0; ci < line.length; ci++) {
        var ch = line[ci].toUpperCase();
        var g  = glyphs[ch];
        if (!g) { ox += cols * cell + spacing; continue; }
        for (var y = 0; y < rows; y++) {
          for (var x = 0; x < cols; x++) {
            if (g[y][x] === '1') {
              dots.push({ cx: ox + x*cell + cell/2, cy: oy + y*cell + cell/2, r: r });
            }
          }
        }
        ox += cols * cell + spacing;
      }
      if (ox > maxW) maxW = ox;
    });

    if (maxW === 0) maxW = cols * cell;
    return { dots: dots, w: maxW, h: lineGap * lines.length };
  }

  function draw() {
    document.getElementById('wLabel').textContent = parseFloat(document.getElementById('weight').value).toFixed(2);
    document.getElementById('sLabel').textContent = document.getElementById('spacing').value + 'px';
    document.getElementById('cLabel').textContent = document.getElementById('cellsize').value + 'px';
    document.getElementById('gLabel').textContent = document.getElementById('linegap').value + 'px';

    var res    = computeDots();
    var canvas = document.getElementById('canvas');
    canvas.innerHTML = '';
    canvas.style.width  = res.w + 'px';
    canvas.style.height = res.h + 'px';

    res.dots.forEach(function (dot) {
      var el = document.createElement('div');
      el.className = 'dot-el';
      var d = dot.r * 2;
      el.style.left   = dot.cx + 'px';
      el.style.top    = dot.cy + 'px';
      el.style.width  = d + 'px';
      el.style.height = d + 'px';
      canvas.appendChild(el);
    });

    document.getElementById('dotCount').textContent = res.dots.length + ' dots';
  }

  function exportSvg() {
    var res   = computeDots();
    var lines = [
      '<svg xmlns="http://www.w3.org/2000/svg" width="' + res.w + '" height="' + res.h + '" viewBox="0 0 ' + res.w + ' ' + res.h + '">'
    ];
    res.dots.forEach(function (d) {
      lines.push('  <circle cx="' + d.cx.toFixed(1) + '" cy="' + d.cy.toFixed(1) + '" r="' + d.r.toFixed(1) + '" fill="black"/>');
    });
    lines.push('</svg>');
    var svg  = lines.join('\n');
    var blob = new Blob([svg], { type: 'image/svg+xml' });
    var url  = URL.createObjectURL(blob);
    var a    = document.createElement('a');
    a.href = url; a.download = 'dot-font.svg';
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  ['txt','weight','spacing','cellsize','linegap'].forEach(function(id) {
    document.getElementById(id).addEventListener('input', draw);
  });
  document.getElementById('exportBtn').addEventListener('click', exportSvg);

  draw();
})();
</script>
</body>
</html>
